version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adapt_postgres
    restart: always
    environment:
      POSTGRES_DB: adapt_db
      POSTGRES_USER: adapt_user
      POSTGRES_PASSWORD: adapt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapt_user -d adapt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adapt_backend
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://adapt_user:adapt_password@postgres:5432/adapt_db
      - DATABASE_URL_SYNC=postgresql://adapt_user:adapt_password@postgres:5432/adapt_db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - EMBEDDING_PROVIDER=gemini
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adapt_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
